<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Rekommenderade böcker</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<h1>Rekommenderade böcker</h1>

<nav>
    <a href="/home">Startsida</a> |
    <a href="/genre">Filtrera efter genre</a>
</nav>

<table border="1">
    <thead>
    <tr>
        <th>Titel</th>
        <th>Författare</th>
        <th>Genre</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="book : ${books}">
        <td th:text="${book.title}">Titel</td>
        <td th:text="${book.author}">Författare</td>
        <td th:text="${book.genre}">Genre</td>
    </tr>
    </tbody>
</table>
</body>
</html>
